dataset: data/processed/dataset_target_only_v1.csv
model: lgbm
target: y
target_offset_hours: 168
split: valid

features:
  - emissionfactor (kg CO2/kWh)
  - target_lag_1
  - target_lag_2
  - target_lag_3
  - target_lag_24
  - target_lag_48
  - target_lag_168
  - target_lag_336
  - target_lag_504
  - is_holiday
  - is_weekend

base_params:
  objective: regression_l1
  random_state: 42
  n_jobs: 1
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 1
  num_leaves: 2
  min_child_samples: 100
  reg_lambda: 1.0

runs:
  # Retain the best squared-error model as a reference.
  - params:
      objective: regression
      n_estimators: 400
  # Retain both evaluated absolute-error models (200 trees).
  - params: {}
  - params:
      max_depth: 2
      num_leaves: 4
  # Absolute-error tree-count search at depths one and two.
  - params:
      n_estimators: 100
  - params:
      n_estimators: 400
  - params:
      n_estimators: 800
  - params:
      max_depth: 2
      num_leaves: 4
      n_estimators: 100
  - params:
      max_depth: 2
      num_leaves: 4
      n_estimators: 400
  - params:
      max_depth: 2
      num_leaves: 4
      n_estimators: 800
  # Vary leaf size and L2 separately around the current L1 winner (run 002).
  - params:
      min_child_samples: 50
  - params:
      min_child_samples: 300
  - params:
      reg_lambda: 0.0
  - params:
      reg_lambda: 10.0
