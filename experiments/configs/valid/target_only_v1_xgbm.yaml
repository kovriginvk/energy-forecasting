dataset: data/processed/dataset_target_only_v1.csv
model: xgbm
target: y
target_offset_hours: 168
split: valid

features:
  - emissionfactor (kg CO2/kWh)
  - target_lag_1
  - target_lag_2
  - target_lag_3
  - target_lag_24
  - target_lag_48
  - target_lag_168
  - target_lag_336
  - target_lag_504
  - is_holiday
  - is_weekend

base_params:
  objective: reg:absoluteerror
  tree_method: hist
  random_state: 42
  n_jobs: 1
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 2
  min_child_weight: 20
  reg_lambda: 1.0

runs:
  # Retain the best squared-error model as a reference.
  - params:
      objective: reg:squarederror
      max_depth: 1
      n_estimators: 400
  # Retain both evaluated absolute-error models (200 trees).
  - params:
      max_depth: 1
  - params: {}
  # Absolute-error tree-count search at depths one and two.
  - params:
      max_depth: 1
      n_estimators: 100
  - params:
      max_depth: 1
      n_estimators: 400
  - params:
      max_depth: 1
      n_estimators: 800
  - params:
      n_estimators: 100
  - params:
      n_estimators: 400
  - params:
      n_estimators: 800
  # Vary child weight and L2 separately around the current L1 winner (run 003).
  - params:
      min_child_weight: 5
  - params:
      min_child_weight: 100
  - params:
      reg_lambda: 0.0
  - params:
      reg_lambda: 10.0
