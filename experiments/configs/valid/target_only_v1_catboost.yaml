dataset: data/processed/dataset_target_only_v1.csv
model: catboost
target: y
target_offset_hours: 168
split: valid

features:
  - emissionfactor (kg CO2/kWh)
  - target_lag_1
  - target_lag_2
  - target_lag_3
  - target_lag_24
  - target_lag_48
  - target_lag_168
  - target_lag_336
  - target_lag_504
  - is_holiday
  - is_weekend

base_params:
  loss_function: MAE
  random_seed: 42
  thread_count: 1
  verbose: false
  allow_writing_files: false
  iterations: 400
  learning_rate: 0.05
  depth: 2
  l2_leaf_reg: 3.0

runs:
  # Cross objective, depth, and iteration count at learning rate 0.05.
  - params:
      loss_function: MAE
      depth: 1
      iterations: 200
  - params:
      loss_function: MAE
      depth: 1
      iterations: 400
  - params:
      loss_function: MAE
      depth: 1
      iterations: 800
  - params:
      loss_function: MAE
      depth: 2
      iterations: 200
  - params:
      loss_function: MAE
      depth: 2
      iterations: 400
  - params:
      loss_function: MAE
      depth: 2
      iterations: 800
  - params:
      loss_function: MAE
      depth: 4
      iterations: 200
  - params:
      loss_function: MAE
      depth: 4
      iterations: 400
  - params:
      loss_function: MAE
      depth: 4
      iterations: 800
  - params:
      loss_function: MAE
      depth: 6
      iterations: 200
  - params:
      loss_function: MAE
      depth: 6
      iterations: 400
  - params:
      loss_function: MAE
      depth: 6
      iterations: 800
  - params:
      loss_function: MAE
      depth: 8
      iterations: 200
  - params:
      loss_function: MAE
      depth: 8
      iterations: 400
  - params:
      loss_function: MAE
      depth: 8
      iterations: 800
  - params:
      loss_function: RMSE
      depth: 1
      iterations: 200
  - params:
      loss_function: RMSE
      depth: 1
      iterations: 400
  - params:
      loss_function: RMSE
      depth: 1
      iterations: 800
  - params:
      loss_function: RMSE
      depth: 2
      iterations: 200
  - params:
      loss_function: RMSE
      depth: 2
      iterations: 400
  - params:
      loss_function: RMSE
      depth: 2
      iterations: 800
  - params:
      loss_function: RMSE
      depth: 4
      iterations: 200
  - params:
      loss_function: RMSE
      depth: 4
      iterations: 400
  - params:
      loss_function: RMSE
      depth: 4
      iterations: 800
  - params:
      loss_function: RMSE
      depth: 6
      iterations: 200
  - params:
      loss_function: RMSE
      depth: 6
      iterations: 400
  - params:
      loss_function: RMSE
      depth: 6
      iterations: 800
  - params:
      loss_function: RMSE
      depth: 8
      iterations: 200
  - params:
      loss_function: RMSE
      depth: 8
      iterations: 400
  - params:
      loss_function: RMSE
      depth: 8
      iterations: 800
  # Compare slower and faster learning schedules at shallow and deeper trees.
  - params:
      loss_function: MAE
      depth: 2
      learning_rate: 0.01
      iterations: 1200
  - params:
      loss_function: MAE
      depth: 2
      learning_rate: 0.1
      iterations: 400
  - params:
      loss_function: MAE
      depth: 6
      learning_rate: 0.01
      iterations: 1200
  - params:
      loss_function: MAE
      depth: 6
      learning_rate: 0.1
      iterations: 400
  - params:
      loss_function: RMSE
      depth: 2
      learning_rate: 0.01
      iterations: 1200
  - params:
      loss_function: RMSE
      depth: 2
      learning_rate: 0.1
      iterations: 400
  - params:
      loss_function: RMSE
      depth: 6
      learning_rate: 0.01
      iterations: 1200
  - params:
      loss_function: RMSE
      depth: 6
      learning_rate: 0.1
      iterations: 400
  # Cross objective and depth with a broad L2 range; use 400 iterations.
  - params:
      loss_function: MAE
      depth: 2
      l2_leaf_reg: 0.1
  - params:
      loss_function: MAE
      depth: 2
      l2_leaf_reg: 1.0
  - params:
      loss_function: MAE
      depth: 2
      l2_leaf_reg: 10.0
  - params:
      loss_function: MAE
      depth: 2
      l2_leaf_reg: 30.0
  - params:
      loss_function: MAE
      depth: 6
      l2_leaf_reg: 0.1
  - params:
      loss_function: MAE
      depth: 6
      l2_leaf_reg: 1.0
  - params:
      loss_function: MAE
      depth: 6
      l2_leaf_reg: 10.0
  - params:
      loss_function: MAE
      depth: 6
      l2_leaf_reg: 30.0
  - params:
      loss_function: RMSE
      depth: 2
      l2_leaf_reg: 0.1
  - params:
      loss_function: RMSE
      depth: 2
      l2_leaf_reg: 1.0
  - params:
      loss_function: RMSE
      depth: 2
      l2_leaf_reg: 10.0
  - params:
      loss_function: RMSE
      depth: 2
      l2_leaf_reg: 30.0
  - params:
      loss_function: RMSE
      depth: 6
      l2_leaf_reg: 0.1
  - params:
      loss_function: RMSE
      depth: 6
      l2_leaf_reg: 1.0
  - params:
      loss_function: RMSE
      depth: 6
      l2_leaf_reg: 10.0
  - params:
      loss_function: RMSE
      depth: 6
      l2_leaf_reg: 30.0
  # Vary split-score randomness under MAE.
  - params:
      depth: 2
      random_strength: 0.0
  - params:
      depth: 2
      random_strength: 5.0
  - params:
      depth: 6
      random_strength: 0.0
  - params:
      depth: 6
      random_strength: 5.0
  # Vary feature sampling under MAE.
  - params:
      depth: 2
      rsm: 0.5
  - params:
      depth: 2
      rsm: 0.8
  - params:
      depth: 6
      rsm: 0.5
  - params:
      depth: 6
      rsm: 0.8
  # Use explicit Bernoulli bootstrap for row sampling under MAE.
  - params:
      depth: 2
      bootstrap_type: Bernoulli
      subsample: 0.5
  - params:
      depth: 2
      bootstrap_type: Bernoulli
      subsample: 0.8
  - params:
      depth: 6
      bootstrap_type: Bernoulli
      subsample: 0.5
  - params:
      depth: 6
      bootstrap_type: Bernoulli
      subsample: 0.8
