dataset: data/processed/dataset_target_only_v1.csv
model: random_forest
target: y
target_offset_hours: 168
split: valid

features:
  - emissionfactor (kg CO2/kWh)
  - target_lag_1
  - target_lag_2
  - target_lag_3
  - target_lag_24
  - target_lag_48
  - target_lag_168
  - target_lag_336
  - target_lag_504
  - is_holiday
  - is_weekend

base_params:
  criterion: squared_error
  random_state: 42
  n_jobs: 4
  n_estimators: 300
  max_depth: 8
  min_samples_leaf: 20
  max_features: 1.0
  bootstrap: true

runs:
  # Cross depth and leaf size for squared-error training.
  - params:
      criterion: squared_error
      max_depth: 4
      min_samples_leaf: 1
  - params:
      criterion: squared_error
      max_depth: 4
      min_samples_leaf: 20
  - params:
      criterion: squared_error
      max_depth: 4
      min_samples_leaf: 100
  - params:
      criterion: squared_error
      max_depth: 8
      min_samples_leaf: 1
  - params:
      criterion: squared_error
      max_depth: 8
      min_samples_leaf: 20
  - params:
      criterion: squared_error
      max_depth: 8
      min_samples_leaf: 100
  - params:
      criterion: squared_error
      max_depth: 12
      min_samples_leaf: 1
  - params:
      criterion: squared_error
      max_depth: 12
      min_samples_leaf: 20
  - params:
      criterion: squared_error
      max_depth: 12
      min_samples_leaf: 100
  - params:
      criterion: squared_error
      max_depth: 20
      min_samples_leaf: 1
  - params:
      criterion: squared_error
      max_depth: 20
      min_samples_leaf: 20
  - params:
      criterion: squared_error
      max_depth: 20
      min_samples_leaf: 100
  - params:
      criterion: squared_error
      max_depth: null
      min_samples_leaf: 1
  - params:
      criterion: squared_error
      max_depth: null
      min_samples_leaf: 20
  - params:
      criterion: squared_error
      max_depth: null
      min_samples_leaf: 100
  # Compare selected absolute-error forests.
  - params:
      criterion: absolute_error
      max_depth: 4
      min_samples_leaf: 20
  - params:
      criterion: absolute_error
      max_depth: 8
      min_samples_leaf: 20
  - params:
      criterion: absolute_error
      max_depth: 12
      min_samples_leaf: 20
  - params:
      criterion: absolute_error
      max_depth: 20
      min_samples_leaf: 20
  - params:
      criterion: absolute_error
      max_depth: null
      min_samples_leaf: 20
  - params:
      criterion: absolute_error
      max_depth: null
      min_samples_leaf: 100
  # Compare feature sampling.
  - params:
      max_depth: 8
      max_features: 0.5
  - params:
      max_depth: 8
      max_features: sqrt
  - params:
      max_depth: null
      max_features: 0.5
  - params:
      max_depth: null
      max_features: sqrt
  # Compare half-size bootstrap samples.
  - params:
      max_depth: 8
      max_samples: 0.5
  - params:
      max_depth: null
      max_samples: 0.5
  # Compare fewer trees.
  - params:
      max_depth: 8
      n_estimators: 100
  - params:
      max_depth: null
      n_estimators: 100
