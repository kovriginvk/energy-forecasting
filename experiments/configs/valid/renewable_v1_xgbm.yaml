dataset: data/processed/dataset_v1.csv
model: xgbm
target: y
target_offset_hours: 0
split: valid
features:
- sun_volume (kWh)
- wind_land_volume (kWh)
- wind_sea_volume (kWh)
- biomass_volume (kWh)
- is_holiday
- is_weekend
base_params:
  tree_method: hist
  random_state: 42
  n_jobs: 1
  learning_rate: 0.05
  min_child_weight: 10
  reg_lambda: 1.0
runs:
- params:
    objective: reg:squarederror
    max_depth: 2
    n_estimators: 600
- params:
    objective: reg:squarederror
    max_depth: 6
    n_estimators: 600
- params:
    objective: reg:absoluteerror
    max_depth: 2
    n_estimators: 600
- params:
    objective: reg:absoluteerror
    max_depth: 6
    n_estimators: 600
