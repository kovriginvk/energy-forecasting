dataset: data/processed/dataset_target_only_v1.csv
model: regression
target: y
target_offset_hours: 168
split: valid

features:
  - emissionfactor (kg CO2/kWh)
  - target_lag_1
  - target_lag_2
  - target_lag_3
  - target_lag_24
  - target_lag_48
  - target_lag_168
  - target_lag_336
  - target_lag_504
  - is_holiday
  - is_weekend

runs:
  - params:
      fit_intercept: true
      positive: false
  - params:
      fit_intercept: true
      positive: true
  - params:
      fit_intercept: false
      positive: false
  - params:
      fit_intercept: false
      positive: true
