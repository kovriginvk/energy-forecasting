dataset: data/processed/dataset_v1.csv
model: catboost
target: y
target_offset_hours: 0
split: test
features:
- sun_volume (kWh)
- wind_land_volume (kWh)
- wind_sea_volume (kWh)
- biomass_volume (kWh)
- is_holiday
- is_weekend
runs:
- params:
    random_seed: 42
    thread_count: 1
    verbose: false
    allow_writing_files: false
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    loss_function: MAE
    depth: 6
    iterations: 600
