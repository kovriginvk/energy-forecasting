dataset: data/processed/dataset_target_only_v1.csv
model: random_forest
target: y
target_offset_hours: 168
split: test

features:
  - emissionfactor (kg CO2/kWh)
  - target_lag_1
  - target_lag_2
  - target_lag_3
  - target_lag_24
  - target_lag_48
  - target_lag_168
  - target_lag_336
  - target_lag_504
  - is_holiday
  - is_weekend

runs:
  - params:
      criterion: absolute_error
      random_state: 42
      n_jobs: 4
      n_estimators: 300
      max_depth: 8
      min_samples_leaf: 20
      max_features: 1.0
      bootstrap: true
