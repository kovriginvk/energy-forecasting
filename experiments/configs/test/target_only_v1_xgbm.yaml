dataset: data/processed/dataset_target_only_v1.csv
model: xgbm
target: y
target_offset_hours: 168
split: test

features:
  - emissionfactor (kg CO2/kWh)
  - target_lag_1
  - target_lag_2
  - target_lag_3
  - target_lag_24
  - target_lag_48
  - target_lag_168
  - target_lag_336
  - target_lag_504
  - is_holiday
  - is_weekend

runs:
  - params:
      objective: reg:absoluteerror
      tree_method: hist
      random_state: 42
      n_jobs: 1
      n_estimators: 800
      learning_rate: 0.05
      max_depth: 1
      min_child_weight: 20
      reg_lambda: 1.0
