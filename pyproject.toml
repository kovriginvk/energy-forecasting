[project]
name = "energy-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "holidays>=0.107",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1,<9",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas==3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
